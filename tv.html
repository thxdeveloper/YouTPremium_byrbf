<script>
(function () {
  var DB = (location.search.match(/[?&]db=([^&]+)/) || [])[1];
  DB = DB ? decodeURIComponent(DB) : 'https://yt-premium-10236-default-rtdb.firebaseio.com';
  function $(i) { return document.getElementById(i); }
  function com(f) { try { return f(); } catch (e) {} }
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  // ---- acesso à ponte (Firebase Realtime Database, via HTTPS simples) ----
  function req(m, p, b, cb) {
    var x = new XMLHttpRequest();
    x.open(m, DB + p + '.json');
    x.timeout = 8000;
    x.onload = function () {
      var j = null;
      if (x.status >= 200 && x.status < 300) {
        try { j = JSON.parse(x.responseText); } catch (e) {}
        cb(null, j);
      } else cb(x.status);
    };
    x.onerror = x.ontimeout = function () { cb('rede'); };
    if (b !== undefined) { x.setRequestHeader('Content-Type', 'application/json'); x.send(JSON.stringify(b)); }
    else x.send();
  }

  // ---- código desta TV (fica salvo, então é sempre o mesmo) ----
  var code = '';
  try { code = localStorage.getItem('ytp_cod') || ''; } catch (e) {}
  function novoCodigo() {
    var c = String(100000 + Math.floor(Math.random() * 900000));
    try { localStorage.setItem('ytp_cod', c); } catch (e) {}
    return c;
  }
  if (!/^\d{6}$/.test(code)) code = novoCodigo();
  function mostraCodigo() { $('cod').textContent = code.slice(0, 3) + ' ' + code.slice(3); }
  mostraCodigo();

  // ---- estado ----
  var P = null, pronto = false, apiOk = false, pend = null, visivel = false;
  var cur = { id: '', t: '' }, ps = -1, er = 0;
  var proxId = '', proxT = '';
  var lastN = 0, primeira = true;
  var falhas = 0, srvOk = false, ultimoCel = 0, ultimoErro = '';
  var chr = 'none', chrAtivo = 'none', semHost = false, qSel = 'auto', ccOn = false, ccCriado = false, ctlOn = false, ctlCriado = false, pausaAoPronto = false, tamAlvo = '', slim = false, hostT = 0;
  // ---- diagnóstico: abra tv.html?dbg=1 ----
  var dbg = /[?&]dbg=1/.test(location.search), msgOrigins = {}, msgTipos = {};
  function hex(t) { var r = []; for (var i = 0; i < String(t).length; i++) r.push(String(t).charCodeAt(i).toString(16)); return r.join(' '); }
  if (dbg) {
    var dbgEl = document.createElement('div');
    dbgEl.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;background:rgba(0,0,0,.85);color:#0f0;font:14px monospace;padding:6px;max-width:100%;word-break:break-all';
    document.body.appendChild(dbgEl);
    window.addEventListener('message', function (e) {
      msgOrigins[e.origin] = (msgOrigins[e.origin] || 0) + 1;
      var tp = ''; try { tp = (typeof e.data === 'string' ? JSON.parse(e.data) : e.data).event || ''; } catch (x) {}
      if (tp) msgTipos[tp] = (msgTipos[tp] || 0) + 1;
    });
    setInterval(function () {
      var f = document.querySelector('#pw iframe'), src = f ? f.src : '(sem iframe)';
      dbgEl.textContent = 'ch(hex)=' + hex(chr) + ' | ativo(hex)=' + hex(chrAtivo) + ' | semHost=' + semHost + ' | pronto=' + pronto + ' | host=' + (hostDe(chrAtivo) || 'normal') + ' | ps=' + ps +
        ' | src=' + src.slice(0, 60) + ' | origens=' + JSON.stringify(msgOrigins) + ' | eventos=' + JSON.stringify(msgTipos);
    }, 1000);
  }
  var ORD = ['highres', 'hd2880', 'hd2160', 'hd1440', 'hd1080', 'hd720', 'large', 'medium', 'small', 'tiny'];

  // ---- interface ----
  function mensagem(t, ms) {
    var g = $('mg'); g.textContent = t; g.style.display = 'block';
    setTimeout(function () { g.style.display = 'none'; }, ms || 3500);
  }
  function mostraPlayer(v) {
    visivel = v;
    $('pw').style.display = v ? 'block' : 'none';
    $('sb').style.display = v ? 'none' : 'block';
    if (!v) $('ov').style.opacity = 0;
  }
  var ovT = 0;
  function atualizaOv() {
    $('ovt').textContent = cur.t || 'Reproduzindo na TV';
    $('ovs').textContent = ps === 1 ? 'Tocando' : ps === 2 ? 'Pausado' : ps === 3 ? 'Carregando' : '';
    var ct = 0, du = 0;
    if (P && pronto) com(function () { ct = P.getCurrentTime() || 0; du = P.getDuration() || 0; });
    $('ovtm').textContent = du ? fmt(ct) + ' / ' + fmt(du) : '';
    $('ovp').style.width = du ? Math.min(100, ct / du * 100) + '%' : '0';
  }
  function ovMostra() {
    if (!visivel || ctlOn) return;
    $('ov').style.opacity = 1;
    atualizaOv();
    clearTimeout(ovT);
    ovT = setTimeout(function () { $('ov').style.opacity = 0; }, 5000);
  }
  function atualizaStatus() {
    $('d1').className = 'dot' + (srvOk ? ' on' : '');
    var tx = 'Conectando...';
    if (srvOk) tx = 'Servidor conectado';
    else if (falhas >= 2) tx = ultimoErro === '401' || ultimoErro === '403' ? 'Servidor recusou (' + ultimoErro + '): confira as regras do banco' : 'Sem conexão com o servidor (' + ultimoErro + ')';
    $('s1').textContent = tx;
    var cel = ultimoCel && (new Date().getTime() - ultimoCel < 90000);
    $('d2').className = 'dot' + (cel ? ' on' : '');
    $('s2').textContent = cel ? 'Celular conectado' : 'Aguardando o celular';
    $('ins').textContent = cel ? 'Celular conectado! Escolha um vídeo para tocar aqui.' : 'Digite este código no celular para transmitir para esta TV';
    if (visivel && $('ov').style.opacity === '1') atualizaOv();
  }
  function aval(err) {
    if (err) { falhas++; ultimoErro = String(err); if (falhas >= 2) srvOk = false; }
    else { falhas = 0; srvOk = true; ultimoErro = ''; }
    atualizaStatus();
  }

  // ---- player do YouTube ----
  function onEstado(e) {
    ps = e.data;
    if (ps === 1 && pausaAoPronto) { pausaAoPronto = false; com(function () { P.pauseVideo(); }); }
    if (ps === 1) { setTimeout(aplicaQ, 700); setTimeout(aplicaQ, 4000); }
    if (ps === 0) fim();
    ovMostra();
    grava();
  }
  function onErro(e) {
    er = e.data;
    mensagem('Este vídeo não pode ser tocado na TV (erro ' + er + ')', 4000);
    if (proxId) setTimeout(tocaProximo, 3500);
  }
  function onPronto() {
    pronto = true;
    clearTimeout(hostT);
    if (pend) { var p = pend; pend = null; carrega(p.id, p.t, p.s, p.o); }
    else aplicaQ();
  }
  // ---- qualidade e legenda ----
  function niveis() {
    var l = [];
    com(function () { l = P.getAvailableQualityLevels() || []; });
    return l.filter(function (x) { return x !== 'auto'; });
  }
  function melhor(l) {
    for (var i = 0; i < ORD.length; i++) if (l.indexOf(ORD[i]) >= 0) return ORD[i];
    return '';
  }
  // O YouTube ignora o pedido direto de qualidade nos players incorporados. Então, além do pedido,
  // ajustamos o tamanho do player: no automático ele escolhe a resolução pelo tamanho que tem na tela.
  var TAM = { tiny: [256, 144], small: [426, 240], medium: [640, 360], large: [854, 480], hd720: [1280, 720], hd1080: [1920, 1080], hd1440: [2560, 1440], hd2160: [3840, 2160], hd2880: [3840, 2160], highres: [3840, 2160] };
  function aplicaTamanho(alvo) {
    tamAlvo = alvo || '';
    var l = $('pw').getElementsByTagName('iframe');
    if (!l.length) return;
    var st = l[0].style, t = TAM[tamAlvo];
    if (!t) {
      st.position = ''; st.left = ''; st.top = ''; st.width = ''; st.height = '';
      st.transform = ''; st.webkitTransform = ''; st.transformOrigin = ''; st.webkitTransformOrigin = '';
      return;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var sc = Math.min(vw / t[0], vh / t[1]);
    var tr = 'translate(' + ((vw - t[0] * sc) / 2) + 'px,' + ((vh - t[1] * sc) / 2) + 'px) scale(' + sc + ')';
    st.position = 'absolute'; st.left = '0'; st.top = '0';
    st.width = t[0] + 'px'; st.height = t[1] + 'px';
    st.transformOrigin = '0 0'; st.webkitTransformOrigin = '0 0';
    st.transform = tr; st.webkitTransform = tr;
  }
  window.addEventListener('resize', function () { aplicaTamanho(tamAlvo); }, false);
  function aplicaQ() {
    if (!P || !pronto || !cur.id) return;
    var alvo = qSel;
    if (alvo === 'max') alvo = melhor(niveis()) || 'hd2160';
    if (alvo === 'auto') {
      com(function () { if (P.setPlaybackQualityRange) P.setPlaybackQualityRange('tiny', 'highres'); });
      com(function () { P.setPlaybackQuality('default'); });
      aplicaTamanho('');
      return;
    }
    com(function () { P.setPlaybackQuality(alvo); });
    com(function () { if (P.setPlaybackQualityRange) P.setPlaybackQualityRange(alvo, alvo); });
    aplicaTamanho(alvo);
  }
  // legenda: só se decide ao criar o player (é o único jeito que o YouTube respeita); mudar recria o player
  function recriaPlayer() {
    var pos = 0;
    com(function () { pos = P.getCurrentTime() || 0; });
    pausaAoPronto = (ps === 2);
    com(function () { P.destroy(); });
    P = null; pronto = false;
    criaPlayer(cur.id, pos);
  }
  // ---- player (com o "caractere do endereço", igual ao app) ----
  function hostDe(c) { return c && c !== 'none' ? 'https://www.youtube-nocookie.com' : undefined; }   // é para onde o endereço com caractere leva
  function criaPlayer(id, s) {
    chrAtivo = semHost ? 'none' : chr;
    pronto = false;
    $('pw').innerHTML = '<div id="player"></div>';
    var cfg = {
      width: '100%', height: '100%', videoId: id,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, controls: ctlOn ? 1 : 0, disablekb: ctlOn ? 0 : 1, fs: ctlOn ? 1 : 0, modestbranding: 1, iv_load_policy: 3, cc_load_policy: ccOn ? 1 : 0, start: Math.floor(s) },
      events: { onReady: onPronto, onStateChange: onEstado, onError: onErro }
    };
    ccCriado = ccOn; ctlCriado = ctlOn;
    if (ccOn) { cfg.playerVars.cc_lang_pref = 'pt'; cfg.playerVars.hl = 'pt'; }
    var h = hostDe(chrAtivo);
    if (h) cfg.host = h;
    P = new YT.Player('player', cfg);
    clearTimeout(hostT);
    if (h && !dbg) hostT = setTimeout(function () {
      if (pronto) return;
      semHost = true;   // o endereço especial não abriu nesta TV: volta ao normal
      mensagem('O modo especial não carregou. Usando o endereço normal.', 6000);
      com(function () { P.destroy(); });
      P = null; pronto = false;
      if (cur.id) carrega(cur.id, cur.t, 0, {});
    }, 12000);
  }
  function carrega(id, t, s, o) {
    if (!/^[\w-]{11}$/.test(id || '')) return;
    o = o || {};
    if (o.ch !== undefined && o.ch !== null) {
      var nc = String(o.ch || 'none').slice(0, 5);
      if (nc !== chr) { chr = nc; semHost = false; }
    }
    if (o.q) qSel = o.q;
    if (o.cc !== undefined && o.cc !== null) ccOn = !!+o.cc;
    if (o.ctl !== undefined && o.ctl !== null) ctlOn = !!+o.ctl;
    cur = { id: id, t: t || '' };
    er = 0; ps = 3;
    s = Math.max(0, +s || 0);
    mostraPlayer(true);
    if (!apiOk || (P && !pronto)) { pend = { id: id, t: t, s: s, o: o }; return; }
    if (P && (chrAtivo !== (semHost ? 'none' : chr) || ccCriado !== ccOn || ctlCriado !== ctlOn)) {   // o caractere mudou: recria o player
      com(function () { P.destroy(); });
      P = null; pronto = false;
    }
    if (!P) criaPlayer(id, s);
    else com(function () { P.loadVideoById({ videoId: id, startSeconds: s }); });
    ovMostra();
  }
  function tocaProximo() {
    if (!proxId) return;
    var id = proxId, t = proxT;
    proxId = ''; proxT = '';
    carrega(id, t, 0);
  }
  function fim() {
    if (proxId) tocaProximo();
    else { mostraPlayer(false); mensagem('Fim da reprodução', 4000); }
  }
  function para() {
    com(function () { if (P && pronto) P.stopVideo(); });
    cur = { id: '', t: '' }; ps = -1; proxId = ''; proxT = ''; pend = null;
    mostraPlayer(false);
  }
  window.onYouTubeIframeAPIReady = function () {
    apiOk = true;
    if (pend) { var p = pend; pend = null; carrega(p.id, p.t, p.s, p.o); }
  };
  var sc = document.createElement('script');
  sc.src = 'https://www.youtube.com/iframe_api';
  sc.onerror = function () { mensagem('Não foi possível carregar o player do YouTube.', 6000); };
  document.getElementsByTagName('head')[0].appendChild(sc);

  // ---- comandos vindos do celular ----
  function exec(c) {
    ultimoCel = new Date().getTime();
    var a = c.a;
    if (a === 'load') { carrega(c.id, c.t, c.s, { ch: c.ch, q: c.q, cc: c.cc, ctl: c.ctl }); proxId = c.ni || ''; proxT = c.nt || ''; }
    else if (a === 'nxt') { proxId = c.ni || ''; proxT = c.nt || ''; }
    else if (a === 'play') com(function () { P.playVideo(); });
    else if (a === 'pause') com(function () { P.pauseVideo(); });
    else if (a === 'seek') com(function () { P.seekTo(+c.s || 0, true); });
    else if (a === 'rel') com(function () { P.seekTo(Math.max(0, P.getCurrentTime() + (+c.s || 0)), true); });
    else if (a === 'stop') para();
    else if (a === 'q') { qSel = c.q || 'auto'; aplicaQ(); setTimeout(aplicaQ, 1500); }
    else if (a === 'ctl') { ctlOn = !!+c.v; if (ctlOn) $('ov').style.opacity = 0; if (P && pronto && cur.id && ctlCriado !== ctlOn) recriaPlayer(); }
    else if (a === 'cc') { ccOn = !!+c.v; if (P && pronto && cur.id && ccCriado !== ccOn) recriaPlayer(); }
    if (a === 'seek' || a === 'rel' || a === 'play' || a === 'pause') ovMostra();
    atualizaStatus();
    setTimeout(grava, 400);
  }
  function loopCmd() {
    req('GET', '/salas/' + code + '/cmd', undefined, function (err, j) {
      aval(err);
      if (!err) {
        if (primeira) { primeira = false; lastN = j && j.n ? j.n : 0; }   // ignora comando antigo
        else if (j && j.n !== lastN) { lastN = j.n; exec(j); }
      }
      setTimeout(loopCmd, 1000);
    });
  }

  // ---- estado enviado ao celular ----
  function estado() {
    var o = { ts: { '.sv': 'timestamp' }, v: 1, n: lastN, ps: ps, id: cur.id, t: (cur.t || '').slice(0, 150), ct: 0, du: 0, nx: proxId, er: er, q: '', ql: '', cc: ccOn ? 1 : 0, hs: semHost ? 2 : (chrAtivo !== 'none' ? 1 : 0) };
    if (P && pronto && cur.id) com(function () {
      o.ct = Math.floor(P.getCurrentTime() || 0);
      o.du = Math.floor(P.getDuration() || 0);
      o.q = P.getPlaybackQuality() || '';
      o.ql = niveis().join(',');
      if (!cur.t) {
        var d = P.getVideoData && P.getVideoData();
        if (d && d.title) { cur.t = d.title; o.t = cur.t.slice(0, 150); }
      }
    });
    if (slim) { delete o.q; delete o.ql; delete o.cc; delete o.hs; }
    return o;
  }
  var gBusy = false, gDirty = false;
  function grava() {
    if (gBusy) { gDirty = true; return; }
    gBusy = true; gDirty = false;
    req('PUT', '/salas/' + code + '/tv', estado(), function (err) {
      gBusy = false;
      if (err && (+err === 401 || +err === 403) && !slim) { slim = true; gDirty = true; mensagem('O banco recusou campos novos. Usando o modo simples.', 5000); }
      else aval(err);
      if (gDirty) grava();
    });
  }
  function loopTv() { grava(); setTimeout(loopTv, 2000); }

  $('nv').onclick = function () {
    var velho = code;
    code = novoCodigo();
    primeira = true; lastN = 0; ultimoCel = 0;
    mostraCodigo();
    setTimeout(function () { req('DELETE', '/salas/' + velho, undefined, function () {}); }, 3000);   // espera terminar qualquer envio em andamento
    atualizaStatus();
  };
  window.onerror = function (m, u, l) { $('er').textContent = 'Erro: ' + m + ' (linha ' + l + ')'; };
  setInterval(atualizaStatus, 1000);
  try { $('nv').focus(); } catch (e) {}
  atualizaStatus();
  loopCmd();
  loopTv();
})();
</script>
</body>
</html>
